name: Sync Fork

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/DevanshPaltewar30/Devansh_Portfolio
      - name: Fetch upstream
        run: |
          git fetch upstream main

      - name: Sync fork
        run: |
          git checkout main
          git merge upstream/main --ff-only

      - name: Push changes
        run: |
          git push origin main
